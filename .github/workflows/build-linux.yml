name: Linux AppImage
run-name: Linux AppImage (${{ github.ref_name }})
on:
  workflow_dispatch:
    inputs:
      verify_update:
        description: Verify an already-published AppImage can download an update
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Build AppImage
        if: ${{ !inputs.verify_update }}
        run: |
          npm ci --no-fund
          npm run check
          npm run dist:linux
      - name: Download the released AppImage
        if: ${{ inputs.verify_update }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern '*.AppImage' --dir dist
          chmod +x dist/*.AppImage
      - name: Test the packaged launcher
        env:
          VERIFY_UPDATE: ${{ inputs.verify_update }}
        run: |
          npm install --prefix "$RUNNER_TEMP/relay-smoke" --no-save --ignore-scripts playwright@1.65.1
          NODE_PATH="$RUNNER_TEMP/relay-smoke/node_modules" xvfb-run -a node scripts/smoke-appimage.cjs dist/*.AppImage
      - name: Test the managed Linux Java runtime
        if: ${{ !inputs.verify_update }}
        run: node scripts/smoke-appimage.cjs --java
      - name: Upload Linux release files
        if: ${{ !inputs.verify_update }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: relay-linux-x64
          path: |
            dist/*.AppImage
            dist/latest-linux.yml
          if-no-files-found: error
          compression-level: 0
